<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音源配布サイト</title>
  <link rel="stylesheet" href="style.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9991340076627705"
     crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <h1>音源配布サイト</h1>
    <p>ハッシュタグ検索 / 最新欄 / カテゴリ別表示</p>
  </header>

  <main class="container">
    <section class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="検索 例: #紙 #破る #捲る"
      />
    </section>

    <section class="section-block">
      <div class="section-title-row">
        <h2>最新欄</h2>
        <span class="section-sub">最新の音源がここに表示されます</span>
      </div>
      <div id="latestList" class="card-grid"></div>
    </section>

    <section class="section-block">
      <div class="section-title-row">
        <h2>カテゴリ別</h2>
        <span class="section-sub">分類済みの音源</span>
      </div>
      <div id="categorySections"></div>
    </section>
    <section class="section-block">
  <div class="section-title-row">
    <h2>お問い合わせ</h2>
    <span class="section-sub">ご連絡はこちらから</span>
  </div>

  <form id="contact-form">
    <input type="text" name="user_name" placeholder="名前" required />
    <br><br>
    <input type="email" name="user_email" placeholder="メールアドレス" required />
    <br><br>
    <textarea name="message" placeholder="内容" required></textarea>
    <br><br>
    <button type="submit">送信</button>
  </form>
</section>

    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, sendSignInLinkToEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "ここにAPIキー",
  authDomain: "ここにドメイン",
  projectId: "ここにID",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("contact-form");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = form.user_email.value;

  const actionCodeSettings = {
    url: "https://nagisa0711.github.io/send.html",
    handleCodeInApp: true,
  };

  try {
    await sendSignInLinkToEmail(auth, email, actionCodeSettings);

    localStorage.setItem("emailForSignIn", email);

    alert("確認メール送った！");
  } catch (error) {
    console.error(error);
    alert("失敗");
  }
});
</script>
    
  </main>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, sendSignInLinkToEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "ここにAPIキー",
  authDomain: "ここにauthDomain",
  projectId: "ここにprojectId",
  appId: "ここにappId"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("contact-form");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = form.user_email.value.trim();

  const actionCodeSettings = {
    url: "https://nagisa0711.github.io/send.html",
    handleCodeInApp: true
  };

  try {
    await sendSignInLinkToEmail(auth, email, actionCodeSettings);
    localStorage.setItem("emailForSignIn", email);
    alert("確認メールを送りました。メール内のリンクから続けてください。");
  } catch (error) {
    console.error(error);
    alert("認証メールの送信に失敗しました。");
  }
});
</script>

  <script type="module" src="script.js"></script>
</body>
  
</html>
