<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音源配布サイト</title>
  <link rel="stylesheet" href="style.css" />
  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9991340076627705"
    crossorigin="anonymous"
  ></script>
</head>
<body>
  <header class="topbar">
    <h1>音源配布サイト</h1>
    <p>ハッシュタグ検索 / 最新欄 / カテゴリ別表示</p>
  </header>

  <main class="container">
    <section class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="検索 例: #紙 #破る #捲る"
      />
    </section>

    <section class="section-block">
      <div class="section-title-row">
        <h2>最新欄</h2>
        <span class="section-sub">最新の音源がここに表示されます</span>
      </div>
      <div id="latestList" class="card-grid"></div>
    </section>

    <section class="section-block">
      <div class="section-title-row">
        <h2>カテゴリ別</h2>
        <span class="section-sub">分類済みの音源</span>
      </div>
      <div id="categorySections"></div>
    </section>

    <section class="section-block contact-entry-section">
      <div class="section-title-row">
        <h2>音源投稿・お問い合わせ</h2>
        <span class="section-sub">メール確認ページから進めます</span>
      </div>

      <div class="contact-entry-box">
        <p class="contact-entry-text">
          欲しい音源のリクエストやお問い合わせをご希望の方は、下のボタンからメール確認ページへ進んでください。
        </p>

        <button id="goToMailConfirmBtn" class="mail-confirm-button" type="button">
          メール確認ページへ進む
        </button>
      </div>
    </section>
  </main>

  <script>
    const goToMailConfirmBtn = document.getElementById("goToMailConfirmBtn");

    if (goToMailConfirmBtn) {
      goToMailConfirmBtn.addEventListener("click", () => {
        window.location.href = "mail-confirm.html";
      });
    }
  </script>

  <script type="module" src="script.js"></script>
</body>
</html>
