<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>メール確認 | 音源配布サイト</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>メール確認</h1>
    <p>認証メールを送信します</p>
  </header>

  <main class="container">
    <section class="section-block">
      <div class="section-title-row">
        <h2>メールアドレス入力</h2>
        <span class="section-sub">確認リンクを送信します</span>
      </div>

      <form id="mail-auth-form">
        <input
          type="email"
          id="user_email"
          placeholder="メールアドレス"
          required
        />
        <br /><br />
        <button type="submit">確認メールを送る</button>
      </form>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, sendSignInLinkToEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB85JHieDeCFR-6IUxe80nztxRtJYdL8dw",
      authDomain: "mail-auth-system.firebaseapp.com",
      projectId: "mail-auth-system",
      appId: "1:704724659793:web:532bce406ae145c1035270"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("mail-auth-form");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("user_email").value.trim();

      const actionCodeSettings = {
        url: "https://nagisa0711.github.io/send.html",
        handleCodeInApp: true
      };

      try {
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        localStorage.setItem("emailForSignIn", email);
        alert("確認メールを送りました。メール内のリンクから続けてください。");
      } catch (error) {
        console.error(error);
        alert("認証メールの送信に失敗しました。");
      }
    });
  </script>
</body>
</html>
