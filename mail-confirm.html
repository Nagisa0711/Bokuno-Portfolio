<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>メール認証</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="section-block">
    <div class="section-title-row">
      <h2>メール認証</h2>
      <span class="section-sub">確認用メールを送信します</span>
    </div>

    <form id="mail-auth-form">
      <input
        type="email"
        id="user_email"
        name="user_email"
        placeholder="メールアドレス"
        required
        autocomplete="email"
      />
      <br><br>
      <button type="submit">確認メールを送る</button>
    </form>

    <p id="result"></p>
  </section>

  <script type="module" src="mail-confirm.js"></script>
</body>
</html>
